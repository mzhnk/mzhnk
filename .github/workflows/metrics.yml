name: Generate Metrics Fun

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics-fun:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Contribution skyline (animated 3D city)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: skyline.svg
          base: ""
          plugin_skyline: yes
          plugin_skyline_frames: 60
          output_action: commit
          committer_branch: metrics-output
          committer_message: "chore: update skyline [skip ci]"

      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          output_action: commit
          committer_branch: metrics-output
          committer_message: "chore: update achievements [skip ci]"
