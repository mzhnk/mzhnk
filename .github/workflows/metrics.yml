name: Generate Metrics Fun

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics-fun:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Isometric 3D commit calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          output_action: commit
          committer_branch: metrics-output
          committer_message: "chore: update isocalendar [skip ci]"

      - name: Achievements
        if: always()
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          output_action: commit
          committer_branch: metrics-output
          committer_message: "chore: update achievements [skip ci]"
